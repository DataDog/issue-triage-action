# Maps GitHub team handles to the Slack channel where triage notifications are posted.
# The triage workflow looks up the selected team here to find its channel.
# Format mirrors datadog-agent's tasks/libs/pipeline/github_slack_map.yaml.
#
# IMPORTANT: the Slack bot (SLACK_DATADOG_AGENT_BOT_TOKEN) must be a member of
# each channel below, otherwise the notification step will fail (the job won't
# fail — the error is caught — but no message is posted).
'@datadog/agent-build': '#agent-build'
'@datadog/agent-delivery': '#agent-delivery'
'@datadog/agent-runtimes': '#agent-runtimes'
