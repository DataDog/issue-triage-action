---
# Caller workflow that exercises the reusable issue-triage workflow on THIS repo.
name: "Issue Triage (self-test)"

on:
    issues:
        types: [opened, reopened]
    workflow_dispatch:
        inputs:
            issue_number:
                description: "Issue number to triage manually"
                required: true
                type: number

jobs:
    triage:
        permissions:
            contents: read
            issues: write
            actions: write
            id-token: write
        uses: DataDog/issue-triage-action/.github/workflows/issue-triage.yml@ee200860ba35ba6ed3ad565e918afb16811fe975 # v1.0.0
        with:
            slack_map_path: .github/workflows/config/github_slack_map.yaml
            environment_name: test # required — create a GitHub environment named "test" in this repo
            # fallback_channel: agent-devx-ops   # optional, this is the default
            # fallback_team: agent-devx          # optional, this is the default
            issue_number: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.issue_number) || 0 }}
        # Required so the reusable workflow can read the ANTHROPIC_API_KEY and
        # SLACK_BOT_TOKEN secrets from the "test" environment. Without inherit,
        # environment secrets resolve to empty strings in the called workflow.
        secrets: inherit
