---
# Drop this file into .github/workflows/ in any repo that wants issue triage.
# Prerequisites:
#   - A GitHub environment matching the environment_name input below, defining
#     secrets named exactly ANTHROPIC_API_KEY and SLACK_BOT_TOKEN (read directly
#     by the triage job; passed through via `secrets: inherit`).
#   - Issue labels "pending", "oss/0", and "team/<name>" labels created in the repo
#   - A github_slack_map.yaml file at the path given in slack_map_path
name: "Issue Triage"

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage manually'
        required: true
        type: number

jobs:
  triage:
    uses: DataDog/issue-triage-action/.github/workflows/issue-triage.yml@main
    with:
      slack_map_path: .github/workflows/config/github_slack_map.yaml
      environment_name: main               # required — must match a GitHub environment in this repo
      # fallback_channel: agent-devx-ops   # optional, this is the default
      # fallback_team: agent-devx           # optional, this is the default
      issue_number: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.issue_number) || 0 }}
    # Required: lets the reusable workflow read the secrets from the GitHub
    # environment named above. Without it, environment secrets resolve to "".
    secrets: inherit
